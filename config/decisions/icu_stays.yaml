# =============================================================================
# ICU stays (platform test): decision log
# =============================================================================
# A minimal dashboard that tests the platform; see
# src/clif_dash/dashboards/icu_stays/__init__.py. Site-wide decisions come
# from platform.yaml.
# =============================================================================

version: 1

shared:
  - id: stay_definition
    label: ICU stay
    value: adt_icu
    display: An adult encounter with any ADT row whose location_category is icu; attributed to the first ICU location
    alternatives: []
    source: Platform test

metrics:
  hospital_mortality:
    number: T1
    domain: ICU stays
    title: Hospital mortality after an ICU stay
    short: Hospital mortality
    unit: "%"
    direction: lower
    target: null
    numerator: Encounters discharged as expired
    denominator: Adult encounters with any ICU stay
    decisions: []

  icu_days:
    number: T2
    domain: ICU stays
    title: ICU days per encounter
    short: ICU days
    unit: days
    direction: lower
    target: null
    numerator: Median hours in ICU locations, in days, per encounter
    denominator: Adult encounters with any ICU stay
    decisions: []

  deaths_per_icu_days:
    number: T3
    domain: ICU stays
    title: Hospital deaths per 1,000 ICU days
    short: Deaths per 1,000 ICU days
    unit: per 1,000 ICU days
    direction: lower
    target: null
    numerator: Encounters discharged as expired
    denominator: ICU days (hours in ICU locations ÷ 24), summed over adult encounters with any ICU stay
    decisions: []

changelog:
  - date: 2026-10-19
    change: Added as a platform test dashboard
