[project]
name = "clif-dashboards"
version = "0.1.0"
description = "Server-backed ICU quality dashboards over a CLIF 2.1 database"
requires-python = ">=3.12"
dependencies = [
    "clifpy==2.1.0",
    "duckdb==1.5.6",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "pyarrow==26.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
clif-dash = "clif_dash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clif_dash"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
